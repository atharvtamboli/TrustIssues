name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [windows, linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: go test ./...
      - run: python3 scripts/build.py --os ${{ matrix.os }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: trustissues-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
  release:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --prerelease --title "TrustIssues $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
