<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | TrustIssues</title>
<style>body{background:#f3f4f6;color:#172238;font:16px system-ui;margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(340px,80vw);padding:32px;border-radius:16px;background:white}label,input,button{display:block;width:100%;box-sizing:border-box}input,button{padding:12px;margin:6px 0 18px;border-radius:6px;border:1px solid #8894a6;font:inherit}button{background:#17479c;color:white;cursor:pointer}p{color:#963522}</style></head>
<body><main><h1>Sign in to TrustIssues</h1><p id="error" role="alert" hidden>Username or password was incorrect.</p><form method="post" action="/login"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></main><script>document.querySelector('#error').hidden=!new URLSearchParams(location.search).has('failed')</script></body></html>
